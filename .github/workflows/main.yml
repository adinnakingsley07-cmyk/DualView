name: DualView APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android configuration
        run: flutter create --platforms=android --org com.dualview .

      - name: Install dependencies
        run: flutter pub get

      - name: Check Flutter project
        run: flutter analyze

      - name: Build DualView APK
        run: flutter build apk --release

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: DualView-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
